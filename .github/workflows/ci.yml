name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python pin ${{ matrix.python-version }}

      - name: Sync dev + runtime extras
        run: uv sync --extra bypass --extra media --extra state --extra pdf --extra instagram

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

  playwright-smoke:
    name: Playwright integration (ubuntu, py3.13)
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python pin 3.13
      - run: uv sync --extra bypass

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run pytest (integration only)
        run: uv run pytest -q tests/integration
