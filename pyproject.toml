[project]
name = "gimmethatdata"
version = "0.1.0"
description = "All-in-one async web scraper with Textual TUI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "udaysinh-git", email = "udaysinhsapate19@gmail.com" },
]
keywords = ["scraper", "crawler", "tui", "textual", "async", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Baseline deps. Heavier tooling (curl_cffi, playwright, yt-dlp, OCR) lives behind extras.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "trafilatura>=1.12",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "anyio>=4.4",
    "aiolimiter>=1.1",
    "tenacity>=8.4",
    "python-slugify>=8.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
bypass = [
    "curl_cffi>=0.7",
    "playwright>=1.45",
    "playwright-stealth>=1.0.6",
]
media = [
    "yt-dlp>=2024.8.6",
    "Pillow>=10.4",
    "pypdf>=4.3",
]
state = [
    "aiosqlite>=0.20",
]
ocr = [
    "pytesseract>=0.3.10",
]
pdf = [
    "markdown>=3.6",
]
all = [
    "gimmethatdata[bypass,media,state,ocr,pdf]",
]

[project.scripts]
gimmethatdata = "gimmethatdata.cli:app"

[project.urls]
Repository = "https://github.com/udaysinh-git/gimmethatdata"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

# ─── Tool configuration ────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".ignore", "dist", "build"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF",
    "ASYNC",
    "PTH",
    "RET",
]
ignore = [
    "E501",
    "B008",
    "ASYNC240",  # pathlib in async fns: intentional for short filesystem ops
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# Textual's Screen/App subclasses use BINDINGS = [...] as the documented pattern.
"src/gimmethatdata/tui/**" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gimmethatdata"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "markdownify.*",
    "selectolax.*",
    "aiolimiter.*",
    "playwright_stealth.*",
    "pytesseract",
    "markdown",
    "pypdf",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: integration tests (may hit network or use heavy fixtures)",
    "slow: tests that take more than a few seconds",
]
